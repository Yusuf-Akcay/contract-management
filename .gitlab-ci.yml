# GitLab counterpart of .github/workflows/ci.yml, kept as a template (this repo lives on GitHub).
# Same stages: test -> verify -> docker -> smoke. Nothing is pushed or deployed.
stages: [test, verify, docker, smoke]

default:
  image: eclipse-temurin:25-jdk
  interruptible: true

variables:
  MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository

# Testcontainers talks to the dind service over plain TCP
.maven:
  services: ["docker:28-dind"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]

.docker:
  image: docker:28
  services: ["docker:28-dind"]
  variables:
    DOCKER_TLS_CERTDIR: /certs

unit-tests:
  stage: test
  extends: .maven
  script: ./mvnw -B test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml

verify:
  stage: verify
  extends: .maven
  script: ./mvnw -B verify
  artifacts:
    when: always
    expire_in: 1 day
    paths: [target/*.jar]
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml

docker-image:
  stage: docker
  extends: .docker
  needs: [verify]
  script:
    - docker build -t contract-management:local .
    - docker save contract-management:local | gzip > image.tar.gz
  artifacts:
    expire_in: 1 hour
    paths: [image.tar.gz]

# Ports of the compose stack are published on the dind service, hence host "docker".
# The realm import is a bind mount, which needs the runner to share the build directory with services (default for the docker executor).
smoke-test:
  stage: smoke
  extends: .docker
  needs: [docker-image]
  variables:
    API_URL: http://docker:8080
    KEYCLOAK_URL: http://docker:8180
    APP_IMAGE: contract-management:local
    OLLAMA_CHAT_MODEL: qwen2.5:0.5b
    OLLAMA_EMBEDDING_MODEL: all-minilm
    EMBEDDING_DIMENSIONS: "384"
    MIN_SIMILARITY: "0"
    SMOKE_RAG: "1"
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - gunzip -c image.tar.gz | docker load
    - docker compose --profile app --profile rag up -d --no-build
    - ./scripts/smoke-test.sh
  after_script:
    - if [ "$CI_JOB_STATUS" = failed ]; then docker compose --profile app --profile rag logs app ollama-models; fi
    - docker compose --profile app --profile rag down
