spring:
  application:
    name: contract-management
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contract_management}
    username: ${DATABASE_USERNAME:contract}
    password: ${DATABASE_PASSWORD:contract}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Berlin
  flyway:
    locations: classpath:db/migration
    placeholders:
      embedding_dimensions: ${app.documents.embedding-dimensions}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        serialization-mode: via-dto
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8180/realms/contract-management}
          audiences: ${OAUTH2_AUDIENCE:contract-management}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
          temperature: 0.1
          num-ctx: 8192
          # Hard cap: small models occasionally loop; an answer needs far fewer tokens
          num-predict: 400
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: ${app.documents.embedding-dimensions}
        index-type: hnsw
        distance-type: cosine-distance
    mcp:
      server:
        name: contract-management
        version: 1.0.0
        protocol: streamable
        instructions: Read-only access to customer and contract data of an insurance contract management system, plus semantic search in uploaded documents (e.g. insurance terms).

logging:
  level:
    # macOS-only warning from Netty (used by the Ollama client) about its native DNS resolver
    io.netty.resolver.dns.DnsServerAddressStreamProviders: off

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  documents:
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
    top-k: 4
    min-similarity: ${MIN_SIMILARITY:0.35}
  messaging:
    exchange: contract.events
    contract-created-queue: contract.created
    contract-created-routing-key: contract.created
